<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 240" width="100%" height="100%">
  <defs>
    <linearGradient id="portalBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <linearGradient id="glowLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
  </defs>

  <style>
    .bold-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 800; }
    .body-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    .tag-sm { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 700; font-size: 11px; letter-spacing: 2px; }
  </style>

  <rect width="1200" height="240" rx="16" fill="url(#portalBg)" stroke="#1f2937" stroke-width="1.5" />
  <rect x="0" y="0" width="1200" height="4" fill="url(#glowLine)" />

  <g transform="translate(60, 45)">
    <!-- Badge -->
    <rect width="170" height="24" rx="12" fill="#1e1b4b" stroke="#6366f1" stroke-width="1" />
    <text class="tag-sm" fill="#a5b4fc" x="14" y="16">ENTERPRISE GATEWAY</text>

    <!-- Main Title -->
    <text class="bold-title" fill="#ffffff" x="0" y="65" font-size="26">BABYLON.IA CONSULTING &amp; SYSTEM INTEGRATION</text>
    <text class="body-mono" fill="#9ca3af" x="0" y="95" font-size="13">
      Bespoke Multi-Agent Swarms • Forensic Electoral &amp; Legal AI • Global Sourcing • Cross-Platform Architecture
    </text>

    <!-- Quick stats / badges -->
    <g transform="translate(0, 125)">
      <!-- Item 1 -->
      <rect width="240" height="36" rx="6" fill="#111827" stroke="#374151" stroke-width="1" />
      <circle cx="16" cy="18" r="4" fill="#10b981" />
      <text class="body-mono" fill="#e5e7eb" x="28" y="22" font-size="12" font-weight="600">Active Retainers &amp; SLA</text>

      <!-- Item 2 -->
      <rect x="255" y="0" width="240" height="36" rx="6" fill="#111827" stroke="#374151" stroke-width="1" />
      <circle cx="271" cy="18" r="4" fill="#38bdf8" />
      <text class="body-mono" fill="#e5e7eb" x="283" y="22" font-size="12" font-weight="600">NDA &amp; On-Prem Security</text>

      <!-- Item 3 -->
      <rect x="510" y="0" width="260" height="36" rx="6" fill="#111827" stroke="#374151" stroke-width="1" />
      <circle cx="526" cy="18" r="4" fill="#f59e0b" />
      <text class="body-mono" fill="#e5e7eb" x="538" y="22" font-size="12" font-weight="600">Direct Founder Advisory</text>

      <!-- CTA link button indicator -->
      <rect x="785" y="0" width="295" height="36" rx="6" fill="#4338ca" stroke="#6366f1" stroke-width="1" />
      <text class="body-mono" fill="#ffffff" x="805" y="22" font-size="12" font-weight="700">🌐 Visit https://babylonias.com →</text>
    </g>
  </g>
</svg>
