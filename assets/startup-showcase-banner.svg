<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 260" width="100%" height="100%">
  <defs>
    <linearGradient id="showBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060814" />
      <stop offset="50%" stop-color="#0e1329" />
      <stop offset="100%" stop-color="#050711" />
    </linearGradient>

    <linearGradient id="neonCyber" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="30%" stop-color="#3b82f6" />
      <stop offset="70%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#f43f5e" />
    </linearGradient>

    <filter id="showGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    .sh-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 900; letter-spacing: 3px; }
    .sh-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-weight: 700; letter-spacing: 1px; }
    .sh-tag { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 700; font-size: 11px; letter-spacing: 2px; }
  </style>

  <rect width="1200" height="260" rx="16" fill="url(#showBg)" stroke="#1e293b" stroke-width="1.5" />
  <rect x="0" y="0" width="1200" height="4" fill="url(#neonCyber)" />

  <g transform="translate(60, 40)">
    <!-- Badge -->
    <rect width="260" height="26" rx="13" fill="#0f172a" stroke="#0ea5e9" stroke-width="1" />
    <circle cx="16" cy="13" r="4" fill="#06b6d4" filter="url(#showGlow)" />
    <text class="sh-tag" fill="#38bdf8" x="28" y="18">LABS &amp; FOUNDATIONAL ARCHITECTURE</text>

    <!-- Main Title -->
    <text class="sh-title" fill="#ffffff" x="0" y="68" font-size="26">THE BABYLON.IA STARTUP ENGINE &amp; PROVEN MILESTONES</text>
    <text class="sh-mono" fill="#94a3b8" x="0" y="98" font-size="12">
      Forged via AGY (Antigravity) • Gemini CLI • Hegelian Dialectic Core • Multi-Channel Hermes Mesh
    </text>

    <!-- Milestone Pills -->
    <g transform="translate(0, 130)">
      <rect width="210" height="42" rx="8" fill="#1e1b4b" stroke="#6366f1" stroke-width="1"/>
      <text class="sh-mono" fill="#c7d2fe" x="14" y="20" font-size="11">01. GEIST KERNEL</text>
      <text class="sh-mono" fill="#94a3b8" x="14" y="34" font-size="9">Dialectical Self-Improvement</text>

      <rect x="225" y="0" width="210" height="42" rx="8" fill="#0c4a6e" stroke="#0284c7" stroke-width="1"/>
      <text class="sh-mono" fill="#bae6fd" x="239" y="20" font-size="11">02. HERMES MESH</text>
      <text class="sh-mono" fill="#94a3b8" x="239" y="34" font-size="9">Redis Pub/Sub Omnichannel</text>

      <rect x="450" y="0" width="210" height="42" rx="8" fill="#064e3b" stroke="#059669" stroke-width="1"/>
      <text class="sh-mono" fill="#a7f3d0" x="464" y="20" font-size="11">03. AUDITOR.IA</text>
      <text class="sh-mono" fill="#94a3b8" x="464" y="34" font-size="9">Multimodal Vision Forensics</text>

      <rect x="675" y="0" width="210" height="42" rx="8" fill="#701a75" stroke="#c026d3" stroke-width="1"/>
      <text class="sh-mono" fill="#f5d0fe" x="689" y="20" font-size="11">04. RUTH LEGALTECH</text>
      <text class="sh-mono" fill="#94a3b8" x="689" y="34" font-size="9">Actagen Governance Engine</text>

      <rect x="900" y="0" width="180" height="42" rx="8" fill="#831843" stroke="#e11d48" stroke-width="1"/>
      <text class="sh-mono" fill="#fecdd3" x="914" y="20" font-size="11">05. BEIJING HUB</text>
      <text class="sh-mono" fill="#94a3b8" x="914" y="34" font-size="9">Global Sourcing Bridge</text>
    </g>
  </g>
</svg>
