<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="heroBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07060f" />
      <stop offset="40%" stop-color="#0f0c22" />
      <stop offset="80%" stop-color="#080714" />
      <stop offset="100%" stop-color="#030308" />
    </linearGradient>
    
    <linearGradient id="neonGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="35%" stop-color="#38bdf8" />
      <stop offset="70%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>

    <linearGradient id="mottoGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="30%" stop-color="#fb923c" />
      <stop offset="60%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <linearGradient id="cardGradDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181534" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0b0f1d" stop-opacity="0.9" />
    </linearGradient>

    <filter id="hyperGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <pattern id="dotGrid" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="16" cy="16" r="1.2" fill="#818cf8" fill-opacity="0.15"/>
    </pattern>
  </defs>

  <style>
    .brand-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 900; letter-spacing: 3px; }
    .motto-text { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-weight: 800; letter-spacing: 3px; }
    .body-font { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    .mono-font { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
  </style>

  <!-- Background Layer -->
  <rect width="1200" height="440" rx="20" fill="url(#heroBg)" />
  <rect width="1200" height="440" rx="20" fill="url(#dotGrid)" />
  <rect width="1200" height="440" rx="20" fill="none" stroke="url(#neonGradient)" stroke-width="1.8" stroke-opacity="0.5" />

  <!-- Ambient Glowing Orbs -->
  <circle cx="1060" cy="80" r="160" fill="#6366f1" fill-opacity="0.12" filter="url(#hyperGlow)"/>
  <circle cx="120" cy="380" r="140" fill="#06b6d4" fill-opacity="0.09" filter="url(#hyperGlow)"/>
  <circle cx="600" cy="20" r="100" fill="#ec4899" fill-opacity="0.06" filter="url(#hyperGlow)"/>

  <!-- Top Ribbon / Motto -->
  <g transform="translate(50, 35)">
    <rect width="1100" height="34" rx="17" fill="#110e28" stroke="#4c1d95" stroke-width="1.2"/>
    <circle cx="20" cy="17" r="4.5" fill="#f43f5e" filter="url(#hyperGlow)"/>
    <text class="motto-text" fill="url(#mottoGrad)" x="36" y="22" font-size="12">
      ✦ NO FURTHER LIMITS BEYOND IMAGINATION ✦
    </text>
    <text class="mono-font" fill="#94a3b8" x="780" y="22" font-size="11" font-weight="600">
      BABYLON.IA LABS • FOUNDER ECOSYSTEM
    </text>
    <circle cx="1080" cy="17" r="4.5" fill="#10b981" />
  </g>

  <!-- Main Hero Brand & Identity -->
  <g transform="translate(50, 95)">
    <!-- Stylized Monogram Box -->
    <rect width="90" height="90" rx="18" fill="#120f26" stroke="url(#neonGradient)" stroke-width="2" />
    
    <!-- Babel Neural Pyramid / Monogram -->
    <path d="M45 15 L70 30 L70 60 L45 75 L20 60 L20 30 Z" fill="none" stroke="url(#neonGradient)" stroke-width="2" />
    <path d="M45 25 L60 35 L60 55 L45 65 L30 55 L30 35 Z" fill="#4f46e5" fill-opacity="0.25" stroke="#a78bfa" stroke-width="1.2" />
    <circle cx="45" cy="45" r="7" fill="url(#neonGradient)" filter="url(#hyperGlow)"/>
    
    <!-- Hero Text -->
    <g transform="translate(115, 20)">
      <text class="mono-font" fill="#38bdf8" font-size="11" font-weight="700" letter-spacing="2">AUTONOMOUS AGENT SWARMS • FORENSIC AI • CROSS-PLATFORM LABS</text>
      <text class="brand-title" fill="#ffffff" y="38" font-size="34">JUAN ESTEBAN GÓMEZ BERNAL</text>
      <text class="body-font" fill="url(#neonGradient)" y="64" font-size="16" font-weight="700" letter-spacing="1.5">
        DOMINUSBABEL  |  FOUNDER &amp; CHIEF SYSTEMS ARCHITECT @ BABYLON.IA
      </text>
    </g>
  </g>

  <!-- Startup Manifesto Bar -->
  <g transform="translate(50, 215)">
    <rect width="1100" height="52" rx="10" fill="#0d111d" stroke="#1e293b" stroke-width="1.2" />
    <rect x="0" y="0" width="6" height="52" rx="3" fill="url(#neonGradient)" />
    <text class="body-font" fill="#f8fafc" x="24" y="24" font-size="13" font-weight="700">
      "Diseñamos y construimos ecosistemas y productos digitales a la medida de los datos, procesos y necesidades de IA de su organización."
    </text>
    <text class="mono-font" fill="#94a3b8" x="24" y="42" font-size="11">
      Hegelian Geist Self-Improvement Architecture • Asimovian Psychohistory Equilibrium • Sourcing Hub: Beijing &amp; Medellín
    </text>
  </g>

  <!-- Key Startup Metrics Grid -->
  <g transform="translate(50, 290)">
    <!-- Metric 1 -->
    <rect width="260" height="115" rx="12" fill="url(#cardGradDark)" stroke="#4338ca" stroke-width="1" />
    <circle cx="24" cy="28" r="4" fill="#a855f7" />
    <text class="mono-font" fill="#c084fc" x="38" y="32" font-size="11" font-weight="700">01 / AUTONOMOUS FLEET</text>
    <text class="brand-title" fill="#ffffff" x="20" y="65" font-size="20">BABYLON SWARMS</text>
    <text class="mono-font" fill="#94a3b8" x="20" y="86" font-size="11">Trading • Social • Supply Chain</text>
    <text class="mono-font" fill="#38bdf8" x="20" y="103" font-size="10" font-weight="600">Continuous 24/7 Execution</text>
    
    <!-- Metric 2 -->
    <g transform="translate(280, 0)">
      <rect width="260" height="115" rx="12" fill="url(#cardGradDark)" stroke="#1d4ed8" stroke-width="1" />
      <circle cx="24" cy="28" r="4" fill="#38bdf8" />
      <text class="mono-font" fill="#60a5fa" x="38" y="32" font-size="11" font-weight="700">02 / FORENSIC VERIFICATION</text>
      <text class="brand-title" fill="#ffffff" x="20" y="65" font-size="20">AUDITOR.IA &amp; E-14</text>
      <text class="mono-font" fill="#94a3b8" x="20" y="86" font-size="11">Multi-LLM Vision Consensus</text>
      <text class="mono-font" fill="#38bdf8" x="20" y="103" font-size="10" font-weight="600">Gemini • Claude • OpenAI • DeepSeek</text>
    </g>

    <!-- Metric 3 -->
    <g transform="translate(560, 0)">
      <rect width="260" height="115" rx="12" fill="url(#cardGradDark)" stroke="#0e7490" stroke-width="1" />
      <circle cx="24" cy="28" r="4" fill="#22d3ee" />
      <text class="mono-font" fill="#22d3ee" x="38" y="32" font-size="11" font-weight="700">03 / INSTITUTIONAL LAW</text>
      <text class="brand-title" fill="#ffffff" x="20" y="65" font-size="20">ACTAGEN ENGINE</text>
      <text class="mono-font" fill="#94a3b8" x="20" y="86" font-size="11">Ruth-Compliant Standards</text>
      <text class="mono-font" fill="#38bdf8" x="20" y="103" font-size="10" font-weight="600">Corporate Board &amp; State Gov</text>
    </g>

    <!-- Metric 4 -->
    <g transform="translate(840, 0)">
      <rect width="260" height="115" rx="12" fill="url(#cardGradDark)" stroke="#059669" stroke-width="1" />
      <circle cx="24" cy="28" r="4" fill="#34d399" />
      <text class="mono-font" fill="#34d399" x="38" y="32" font-size="11" font-weight="700">04 / GLOBAL DEPLOYMENT</text>
      <text class="brand-title" fill="#ffffff" x="20" y="65" font-size="20">BEIJING &amp; MEDELLÍN</text>
      <text class="mono-font" fill="#94a3b8" x="20" y="86" font-size="11">Hardware / Software Bridge</text>
      <text class="mono-font" fill="#34d399" x="20" y="103" font-size="10" font-weight="700">https://babylonias.com →</text>
    </g>
  </g>
</svg>
