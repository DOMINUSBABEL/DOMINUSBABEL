<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08080c" />
      <stop offset="50%" stop-color="#0f0c1b" />
      <stop offset="100%" stop-color="#050508" />
    </linearGradient>
    
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.7"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#6366f1" stroke-opacity="0.07" stroke-width="1"/>
      <circle cx="40" cy="40" r="1" fill="#818cf8" fill-opacity="0.2"/>
    </pattern>
  </defs>

  <style>
    .title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; font-weight: 900; letter-spacing: 4px; }
    .subtitle { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 600; letter-spacing: 2px; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    .tag { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 700; font-size: 11px; letter-spacing: 1.5px; }
  </style>

  <!-- Background -->
  <rect width="1200" height="420" rx="16" fill="url(#bgGrad)" />
  <rect width="1200" height="420" rx="16" fill="url(#grid)" />
  <rect width="1200" height="420" rx="16" fill="none" stroke="url(#accentGrad)" stroke-width="1.5" stroke-opacity="0.4" />

  <!-- Ambient Light Orbs -->
  <circle cx="1050" cy="90" r="140" fill="#6366f1" fill-opacity="0.12" filter="url(#glow)"/>
  <circle cx="150" cy="350" r="120" fill="#06b6d4" fill-opacity="0.08" filter="url(#glow)"/>

  <!-- Logo Mark / Stylized Tower of Babel & Neural Matrix -->
  <g transform="translate(60, 55)">
    <!-- Outer Shield Box -->
    <rect width="100" height="100" rx="20" fill="#131127" stroke="url(#accentGrad)" stroke-width="2" />
    
    <!-- Babel Geometric Monogram -->
    <path d="M50 18 L76 34 L76 66 L50 82 L24 66 L24 34 Z" fill="none" stroke="url(#accentGrad)" stroke-width="2.5" />
    <path d="M50 28 L68 39 L68 61 L50 72 L32 61 L32 39 Z" fill="#6366f1" fill-opacity="0.15" stroke="#a78bfa" stroke-width="1.5" />
    <path d="M50 38 L60 45 L60 55 L50 62 L40 55 L40 45 Z" fill="url(#accentGrad)" />
    
    <!-- Pulse Ring -->
    <circle cx="50" cy="50" r="42" fill="none" stroke="#38bdf8" stroke-width="1" stroke-dasharray="4 4" stroke-opacity="0.6"/>
  </g>

  <!-- Main Header Text -->
  <g transform="translate(185, 80)">
    <text class="tag" fill="#a78bfa" x="0" y="0">AUTONOMOUS SYSTEMS • FORENSIC AI • HIGH-PERFORMANCE COMPUTING</text>
    <text class="title" fill="#ffffff" x="0" y="42" font-size="38">JUAN ESTEBAN GÓMEZ BERNAL</text>
    <text class="subtitle" fill="url(#accentGrad)" x="0" y="75" font-size="18">DOMINUSBABEL  |  FOUNDER &amp; CHIEF ARCHITECT @ BABYLON.IA</text>
  </g>

  <!-- Philosophical Quote Banner -->
  <g transform="translate(60, 195)">
    <rect width="1080" height="46" rx="8" fill="#0c0b16" stroke="#312e81" stroke-width="1" />
    <circle cx="20" cy="23" r="4" fill="#a855f7" />
    <text class="mono" fill="#e2e8f0" x="36" y="27" font-size="13" font-weight="500">
      &quot;Die Schönheit, die kraftlos ist, hasst den Verstand.&quot; — G.W.F. Hegel  |  Geist Architecture &amp; Asimovian Equilibrium
    </text>
    <rect x="940" y="10" width="125" height="26" rx="13" fill="#1e1b4b" stroke="#6366f1" stroke-width="1"/>
    <text class="mono" fill="#38bdf8" x="955" y="27" font-size="11" font-weight="700">ACTIVE SYSTEM</text>
  </g>

  <!-- Metric / Portal Cards Grid -->
  <!-- Card 1: Core AI & Geist -->
  <g transform="translate(60, 260)">
    <rect width="255" height="115" rx="12" fill="url(#cardGrad)" stroke="#4338ca" stroke-width="1" />
    <text class="tag" fill="#c084fc" x="18" y="28">01 / AUTONOMOUS AGENTS</text>
    <text class="mono" fill="#ffffff" x="18" y="58" font-size="17" font-weight="700">BABYLON.IA ENGINE</text>
    <text class="mono" fill="#94a3b8" x="18" y="80" font-size="11">Geist Hegelian Multi-Agent</text>
    <text class="mono" fill="#38bdf8" x="18" y="98" font-size="11">Binance • Social • Supply</text>
  </g>

  <!-- Card 2: Forensics & Civic Tech -->
  <g transform="translate(335, 260)">
    <rect width="255" height="115" rx="12" fill="url(#cardGrad)" stroke="#1d4ed8" stroke-width="1" />
    <text class="tag" fill="#60a5fa" x="18" y="28">02 / FORENSIC INTELLIGENCE</text>
    <text class="mono" fill="#ffffff" x="18" y="58" font-size="17" font-weight="700">AUDITOR.IA &amp; E-14</text>
    <text class="mono" fill="#94a3b8" x="18" y="80" font-size="11">Multimodel Vision Fraud OCR</text>
    <text class="mono" fill="#38bdf8" x="18" y="98" font-size="11">Demographic GIS • VOTOFLOW</text>
  </g>

  <!-- Card 3: Governance & LegalTech -->
  <g transform="translate(610, 260)">
    <rect width="255" height="115" rx="12" fill="url(#cardGrad)" stroke="#0e7490" stroke-width="1" />
    <text class="tag" fill="#22d3ee" x="18" y="28">03 / LEGALTECH &amp; COMPLIANCE</text>
    <text class="mono" fill="#ffffff" x="18" y="58" font-size="17" font-weight="700">ACTAGEN ENGINE</text>
    <text class="mono" fill="#94a3b8" x="18" y="80" font-size="11">Ruth-Compliant Automation</text>
    <text class="mono" fill="#38bdf8" x="18" y="98" font-size="11">Governance &amp; Corporate Acts</text>
  </g>

  <!-- Card 4: Enterprise Client Gateway -->
  <g transform="translate(885, 260)">
    <rect width="255" height="115" rx="12" fill="url(#cardGrad)" stroke="#7c3aed" stroke-width="1.2" />
    <text class="tag" fill="#fbbf24" x="18" y="28">04 / CLIENT PORTAL</text>
    <text class="mono" fill="#ffffff" x="18" y="58" font-size="17" font-weight="700">BABYLONIAS.COM</text>
    <text class="mono" fill="#94a3b8" x="18" y="80" font-size="11">Elite High-Tier Consulting</text>
    <text class="mono" fill="#34d399" x="18" y="98" font-size="11">Global Deployments • Sourcing</text>
  </g>
</svg>
