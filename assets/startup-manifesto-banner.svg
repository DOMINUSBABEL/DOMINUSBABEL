<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="manBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0918" />
      <stop offset="50%" stop-color="#140f2e" />
      <stop offset="100%" stop-color="#060610" />
    </linearGradient>

    <linearGradient id="singularityGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="25%" stop-color="#ec4899" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="75%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>

    <filter id="mottoGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    .bold-motto { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 900; letter-spacing: 4px; }
    .sub-motto { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-weight: 600; letter-spacing: 1.5px; }
  </style>

  <rect width="1200" height="200" rx="16" fill="url(#manBg)" stroke="#4338ca" stroke-width="1.5" />
  <rect x="0" y="0" width="1200" height="4" fill="url(#singularityGrad)" />

  <g transform="translate(60, 45)">
    <!-- Badge -->
    <rect width="210" height="26" rx="13" fill="#1e1b4b" stroke="#8b5cf6" stroke-width="1" />
    <text class="sub-motto" fill="#c084fc" x="14" y="18" font-size="11">THE BABYLON.IA CREED</text>

    <!-- Main Motto -->
    <text class="bold-motto" fill="url(#singularityGrad)" x="0" y="70" font-size="28" filter="url(#mottoGlow)">
      NO FURTHER LIMITS BEYOND IMAGINATION
    </text>

    <!-- Subtext -->
    <text class="sub-motto" fill="#94a3b8" x="0" y="105" font-size="13">
      Dialectical Autonomy • Zero Operational Friction • Extreme Engineering Precision • Global Sourcing
    </text>
  </g>
</svg>
