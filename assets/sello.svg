<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;900&amp;family=Cinzel+Decorative:wght@700&amp;display=swap');
      .bg { fill: #0B0D10; }
      .border-outer { stroke: #B8963E; stroke-width: 1.5; fill: none; stroke-opacity: 0.75; }
      .border-inner { stroke: #B8963E; stroke-width: 0.75; fill: none; stroke-opacity: 0.45; stroke-dasharray: 4, 2; }
      .filigree { stroke: #B8963E; stroke-width: 1; fill: none; stroke-opacity: 0.6; }
      .gold-fill { fill: #B8963E; }
      .gold-text { fill: #C9A959; font-family: 'Cinzel', 'Trajan Pro', 'Georgia', serif; }
      .title { font-family: 'Cinzel', 'Trajan Pro', 'Georgia', serif; font-size: 52px; font-weight: 700; letter-spacing: 14px; fill: #E8E2D0; text-anchor: middle; }
      .subtitle { font-family: 'Cinzel', 'Trajan Pro', 'Georgia', serif; font-size: 13px; font-weight: 600; letter-spacing: 6px; fill: #B8963E; text-anchor: middle; }
      .quote { font-family: 'Cinzel', 'Trajan Pro', 'Georgia', serif; font-size: 11px; font-style: italic; letter-spacing: 3.5px; fill: #8E8A7E; text-anchor: middle; }
      .coords { font-family: 'Courier New', monospace; font-size: 9.5px; letter-spacing: 4px; fill: #6B675C; text-anchor: middle; }
    </style>
    
    <pattern id="grain" width="100" height="100" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="0.5" fill="#B8963E" opacity="0.08" />
      <circle cx="80" cy="50" r="0.5" fill="#B8963E" opacity="0.06" />
      <circle cx="40" cy="70" r="0.5" fill="#B8963E" opacity="0.07" />
    </pattern>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="340" class="bg" />
  <rect width="1200" height="340" fill="url(#grain)" />

  <!-- Outer Double Framing -->
  <rect x="20" y="20" width="1160" height="300" class="border-outer" />
  <rect x="26" y="26" width="1148" height="288" class="border-inner" />

  <!-- Classical Corner Rosettes / Quadrants -->
  <!-- Top-Left -->
  <path d="M 20,40 L 40,40 L 40,20" class="filigree" />
  <polygon points="26,26 34,26 34,34 26,34" fill="#B8963E" opacity="0.8" />
  <line x1="20" y1="20" x2="55" y2="55" stroke="#B8963E" stroke-width="0.5" stroke-opacity="0.5" />

  <!-- Top-Right -->
  <path d="M 1180,40 L 1160,40 L 1160,20" class="filigree" />
  <polygon points="1174,26 1166,26 1166,34 1174,34" fill="#B8963E" opacity="0.8" />
  <line x1="1180" y1="20" x2="1145" y2="55" stroke="#B8963E" stroke-width="0.5" stroke-opacity="0.5" />

  <!-- Bottom-Left -->
  <path d="M 20,300 L 40,300 L 40,320" class="filigree" />
  <polygon points="26,314 34,314 34,306 26,306" fill="#B8963E" opacity="0.8" />
  <line x1="20" y1="320" x2="55" y2="285" stroke="#B8963E" stroke-width="0.5" stroke-opacity="0.5" />

  <!-- Bottom-Right -->
  <path d="M 1180,300 L 1160,300 L 1160,320" class="filigree" />
  <polygon points="1174,314 1166,314 1166,306 1174,306" fill="#B8963E" opacity="0.8" />
  <line x1="1180" y1="320" x2="1145" y2="285" stroke="#B8963E" stroke-width="0.5" stroke-opacity="0.5" />

  <!-- Central Heraldic Emblem (Stylized Monolith / Babel Ziggurat + Sword & Scale) -->
  <g transform="translate(600, 78)">
    <!-- Central Star / Compass Rosette -->
    <circle cx="0" cy="0" r="26" fill="none" stroke="#B8963E" stroke-width="1" stroke-opacity="0.5" />
    <circle cx="0" cy="0" r="22" fill="none" stroke="#B8963E" stroke-width="0.5" stroke-dasharray="2, 2" stroke-opacity="0.7" />
    <circle cx="0" cy="0" r="3" fill="#C9A959" />
    
    <!-- Rayons -->
    <path d="M 0,-34 L 0,34 M -34,0 L 34,0" stroke="#B8963E" stroke-width="0.75" stroke-opacity="0.6" />
    <path d="M -22,-22 L 22,22 M -22,22 L 22,-22" stroke="#B8963E" stroke-width="0.5" stroke-opacity="0.35" />

    <!-- Stylized Tower / Monolith Crest -->
    <polygon points="0,-28 7,-10 18,-10 10,-2 13,12 0,4 -13,12 -10,-2 -18,-10 -7,-10" fill="none" stroke="#B8963E" stroke-width="1" stroke-opacity="0.9" />

    <!-- Horizontal Flourishes Left & Right -->
    <path d="M -45,0 L -180,0" stroke="#B8963E" stroke-width="1" stroke-opacity="0.5" />
    <polygon points="-45,-3 -45,3 -52,0" fill="#B8963E" />
    <circle cx="-120" cy="0" r="2.5" fill="#B8963E" />
    <circle cx="-180" cy="0" r="1.5" fill="#B8963E" />

    <path d="M 45,0 L 180,0" stroke="#B8963E" stroke-width="1" stroke-opacity="0.5" />
    <polygon points="45,-3 45,3 52,0" fill="#B8963E" />
    <circle cx="120" cy="0" r="2.5" fill="#B8963E" />
    <circle cx="180" cy="0" r="1.5" fill="#B8963E" />
  </g>

  <!-- Main Seal Inscriptions -->
  <!-- Top Super-Title -->
  <text x="600" y="142" class="subtitle">IVS · INFORMATICA · CYBERNETICA</text>

  <!-- Monumental Title -->
  <text x="600" y="196" class="title">DOMINVS BABEL</text>

  <!-- Latin / Hegel Epigraph -->
  <text x="600" y="228" class="quote">« DIE KRAFTLOSE SCHÖNHEIT HASST DEN VERSTAND »</text>

  <!-- Dividing Line with Center Diamond -->
  <line x1="380" y1="248" x2="570" y2="248" stroke="#B8963E" stroke-width="0.75" stroke-opacity="0.4" />
  <polygon points="600,245 604,248 600,251 596,248" fill="#B8963E" />
  <line x1="630" y1="248" x2="820" y2="248" stroke="#B8963E" stroke-width="0.75" stroke-opacity="0.4" />

  <!-- Bottom Coordinates & Territory -->
  <text x="600" y="274" class="subtitle" style="font-size: 11px; letter-spacing: 5px; fill: #A39B8B;">
    BABYLON.IA &nbsp;·&nbsp; MEDELLÍN &nbsp;·&nbsp; BEIJING &nbsp;·&nbsp; MMXXIV – MMXXVI
  </text>

  <!-- Terminal Motto -->
  <text x="600" y="296" class="coords">NON PLVS VLTRA QVAM IMAGINATIO</text>
</svg>
